<!-- SOC-IA : bloc ajoute a la fin de /var/ossec/etc/ossec.conf du manager -->
<ossec_config>
  <!-- Copilote IA : les alertes reseau (Suricata) et les correlations de niveau >= 8 partent vers n8n
       (VM SOC-IA, 10.10.30.20), qui cree l'alerte TheHive et la fait analyser par Claude.
       Les scans seuls (ER4, niveau 6) restent hors IA : volumineux, deja bloques automatiquement. -->
  <integration>
    <name>custom-n8n</name>
    <hook_url>http://10.10.30.20:5678/webhook/wazuh-alerte</hook_url>
    <level>8</level>
    <group>ids_reseau,correlation</group>
    <alert_format>json</alert_format>
  </integration>
</ossec_config>
