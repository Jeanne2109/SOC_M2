<!-- SOC-LAB : bloc ajoute a la fin de /var/ossec/etc/ossec.conf du manager -->
<ossec_config>
  <!-- Blocage de l'IP source sur OPNsense : script soc-drop execute par l'agent "opnsense" (ID 001),
       qui ajoute l'IP a la table pf __wazuh_agent_drop (bloquee par le plugin os-wazuh-agent) -->
  <command>
    <name>soc-drop</name>
    <executable>soc-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <disabled>no</disabled>
    <command>soc-drop</command>
    <location>defined-agent</location>
    <agent_id>001</agent_id>
    <rules_id>100101,100102,100103,100104,100105,100106,100107</rules_id>
    <timeout>3600</timeout>
  </active-response>
</ossec_config>
