<!-- SOC-LAB isolement : bloc ajoute a la fin de /var/ossec/etc/ossec.conf du manager -->
<!-- Sur corrélation critique 100152 (alerte réseau puis modification de /var/www sur SRV-WEB ; 100150 = Windows, à brancher sur SRV-WIN), le serveur est isolé par son
     propre agent. En labo, timeout 900 s = levee automatique au bout de 15 min (en production :
     <timeout_allowed>no</timeout_allowed>, levee decidee par l'analyste). -->
<ossec_config>
  <command>
    <name>isoler-hote-linux</name>
    <executable>isoler-hote.sh</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <disabled>no</disabled>
    <command>isoler-hote-linux</command>
    <!-- defined-agent et non local : sinon une correlation sur le manager (agent 000) l'isolerait lui-meme -->
    <location>defined-agent</location>
    <agent_id>002</agent_id>
    <rules_id>100152</rules_id>
    <timeout>900</timeout>
  </active-response>
</ossec_config>
